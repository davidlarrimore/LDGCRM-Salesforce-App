.h1c { font-size:16px; font-weight:bold; fill:#12406f; }

.wn  { font-size:11.5px; fill:#8a4b00; }

</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="444" viewBox="0 0 1560 444">
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f4a54"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a2f2f"/></marker>
</defs>
<rect width="1560" height="444" fill="#ffffff"/>

<!-- ===================== the five phases ===================== -->
<rect class="band" x="30" y="26" width="1500" height="252" rx="5"/>
<text class="ph"  x="46" y="52">THE DEPLOYMENT, END TO END</text>
<text class="phn" x="292" y="52">Five phases, in order. Two of them run themselves; the other three are people.</text>

<!-- 1 -->
<rect class="stp" x="42" y="76" width="268" height="176" rx="5"/>
<text class="sec" x="60" y="102">SECTION 1.1</text>
<text class="h1"  x="60" y="126">1   Prepare</text>
<text class="s2"  x="60" y="154">Confirm the two external</text>
<text class="s2"  x="60" y="173">dependencies already exist in</text>
<text class="s2"  x="60" y="192">the target org.</text>
<text class="s2"  x="60" y="215">Production: confirm the</text>
<text class="s2"  x="60" y="234">PureCloud webhook.</text>

<path class="ln" d="M310 156 H340" marker-end="url(#a1)"/>

<!-- 2 -->
<rect class="stpc" x="344" y="76" width="268" height="176" rx="5"/>
<text class="sec" x="362" y="102">SECTION 1.3</text>
<text class="h1c" x="362" y="126">2   Deploy the package</text>
<text class="s2"  x="362" y="154">Change set LDGCRM_Sprint_1_24.</text>
<text class="s2"  x="362" y="173">228 components, 23 types.</text>
<text class="s2"  x="362" y="192">No Apex, so no tests to run.</text>
<text class="s2"  x="362" y="215">Nothing is deleted, and</text>
<text class="s2"  x="362" y="234">nothing has to be switched off.</text>

<path class="ln" d="M612 156 H642" marker-end="url(#a1)"/>

<!-- 3 -->
<rect class="stp" x="646" y="76" width="268" height="176" rx="5"/>
<text class="sec" x="664" y="102">SECTION 1.4</text>
<text class="h1"  x="664" y="126">3   Configure by hand</text>
<text class="s2"  x="664" y="154">What a change set cannot</text>
<text class="s2"  x="664" y="173">carry: page layouts on the</text>
<text class="s2"  x="664" y="192">profile, public group</text>
<text class="s2"  x="664" y="211">membership, the permission</text>
<text class="s2"  x="664" y="230">set groups, the record owners.</text>

<path class="ln" d="M914 156 H944" marker-end="url(#a1)"/>

<!-- 4 -->
<rect class="stpc" x="948" y="76" width="268" height="176" rx="5"/>
<text class="sec" x="966" y="102">SECTION 3.0</text>
<text class="h1c" x="966" y="126">4   Migrate the data</text>
<text class="s2"  x="966" y="154">Readiness check, then a dry</text>
<text class="s2"  x="966" y="173">run, then the load.</text>
<text class="s2"  x="966" y="192">Thirteen steps, in dependency</text>
<text class="s2"  x="966" y="211">order, out of Airtable.</text>
<text class="s2"  x="966" y="234">Owners must exist first.</text>

<path class="ln" d="M1216 156 H1246" marker-end="url(#a1)"/>

<!-- 5 -->
<rect class="stp" x="1250" y="76" width="268" height="176" rx="5"/>
<text class="sec" x="1268" y="102">SECTIONS 1.4, 1.5</text>
<text class="h1"  x="1268" y="126">5   Verify</text>
<text class="s2"  x="1268" y="154">Against the component</text>
<text class="s2"  x="1268" y="173">inventory, not the deployment</text>
<text class="s2"  x="1268" y="192">report. Open records as a</text>
<text class="s2"  x="1268" y="211">NON-ADMIN, and confirm what</text>
<text class="s2"  x="1268" y="230">the load left switched off.</text>


<!-- ===================== rollback ===================== -->
<path class="ln-o" d="M779 278 V294" marker-end="url(#a3)"/>

<rect class="band" x="30" y="298" width="1500" height="122" rx="5"/>
<text class="phr" x="46" y="324">2.0 &#8212; IF IT HAS TO BE UNDONE</text>
<text class="phn" x="290" y="324">Two different operations, with different owners and very different levels of reversibility.</text>

<rect class="stpr" x="42" y="338" width="1476" height="62" rx="5"/>
<text class="rb" x="60" y="364">METADATA</text>
<text class="rn" x="142" y="364">re-deploy the previous version of the components.</text>
<text class="rb" x="500" y="364">DATA</text>
<text class="rn" x="546" y="364">Invoke-MigrationRollback.ps1, scoped to ONE run directory.</text>
<text class="rb" x="60" y="386">The data window closes fast:</text>
<text class="rn" x="252" y="386">safe in the minutes after a load, destructive once people have worked in the org. Fix forward instead.</text>
</svg>
